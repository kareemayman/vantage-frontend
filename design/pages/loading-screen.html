<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantage loading screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Oswald:wght@600;700&amp;family=Shadows+Into+Light&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #E9F5FE; }

</style>
</head>
<body>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #E9F5FE; font-family: 'Figtree', sans-serif; color: #002244;">
  <div style="position: absolute; left: 0; right: 0; top: 80px; display: flex; justify-content: center; align-items: center; gap: 12px;">
    <span style="width: 22px; height: 22px; border-radius: 50%; background: #F4D160; border: 3px solid #002244; box-sizing: border-box;"></span>
    <span style="font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: 0.04em; line-height: 1;">VANTAGE</span>
  </div>
  <svg style="position: absolute; left: 120px; top: 140px; width: 200px; height: 110px;" viewBox="0 0 200 110" aria-hidden="true">
    <path d="M40 95C15 95 10 62 36 58C34 30 72 20 86 42C96 14 146 14 150 48C178 44 192 72 176 88C172 94 166 95 160 95Z" fill="#FFFFFF" stroke="#002244" stroke-width="3.5" stroke-linejoin="round"></path>
  </svg>
  <svg style="position: absolute; left: 1120px; top: 620px; width: 180px; height: 99px;" viewBox="0 0 200 110" aria-hidden="true">
    <path d="M40 95C15 95 10 62 36 58C34 30 72 20 86 42C96 14 146 14 150 48C178 44 192 72 176 88C172 94 166 95 160 95Z" fill="#FFFFFF" stroke="#002244" stroke-width="4" stroke-linejoin="round"></path>
  </svg>
  <svg style="position: absolute; left: 220px; top: 260px; width: 1000px; height: 360px;" viewBox="0 0 1000 360" aria-label="Plane flying from your couch to summer" role="img">
    <path d="M60 300Q500 -60 940 300" fill="none" stroke="#C3B089" stroke-width="4" stroke-dasharray="3 14" stroke-linecap="round"></path>
    <path d="M60 300Q330 82 600 110" fill="none" stroke="#1D5D9B" stroke-width="5" stroke-linecap="round"></path>
    <circle cx="60" cy="300" r="18" fill="#FFFFFF" stroke="#002244" stroke-width="4"></circle>
    <circle cx="940" cy="300" r="22" fill="#F4D160" stroke="#002244" stroke-width="4"></circle>
    <g transform="translate(560 54) rotate(4) scale(0.75)">
      <path d="M38 58L22 18Q20 12 28 12L48 12Q54 12 58 20L74 52Z" fill="#75C2F6" stroke="#002244" stroke-width="5" stroke-linejoin="round"></path>
      <path d="M30 60Q30 44 52 44L170 44Q214 44 222 66Q214 86 172 86L54 86Q30 86 30 70Z" fill="#FFFFFF" stroke="#002244" stroke-width="5" stroke-linejoin="round"></path>
      <rect x="52" y="70" width="128" height="5" fill="#1D5D9B"></rect>
      <path d="M200 48Q220 54 222 66Q218 78 204 82Q194 66 200 48Z" fill="#F4D160" stroke="#002244" stroke-width="5" stroke-linejoin="round"></path>
      <circle cx="98" cy="59" r="7" fill="#75C2F6" stroke="#002244" stroke-width="3"></circle>
      <circle cx="134" cy="59" r="7" fill="#75C2F6" stroke="#002244" stroke-width="3"></circle>
      <path d="M100 70L142 70L120 112Q116 118 108 118L98 118Q90 118 93 111Z" fill="#1D5D9B" stroke="#002244" stroke-width="5" stroke-linejoin="round"></path>
    </g>
  </svg>
  <div style="position: absolute; left: 200px; top: 600px; width: 160px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em;">Your couch</div>
  <div style="position: absolute; left: 1080px; top: 600px; width: 160px; text-align: center; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em;">Summer</div>
  <div style="position: absolute; left: 0; right: 0; top: 660px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Loading" style="font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 72px; line-height: 1;">64%</div>
    <div style="font-family: 'Shadows Into Light', cursive; font-size: 30px; color: #1D5D9B; transform: rotate(-2deg);">fastening seatbelts...</div>
  </div>
  <button type="button" style="position: absolute; right: 40px; bottom: 36px; padding: 12px 18px; background: transparent; border: 2px solid #002244; border-radius: 12px; font-family: 'Figtree', sans-serif; font-weight: 700; font-size: 15px; color: #002244; cursor: pointer;">Skip the 3D</button>
</div>

</body>
</html>
