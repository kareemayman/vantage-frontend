<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The tab icon: components/logo.tsx with a thicker rim and no small waves, for 16px.
       The rim gets lighter on a dark browser, where navy would vanish. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .rim {
        stroke: #4a7db3;
      }
    }
  </style>
  <clipPath id="edge">
    <circle cx="16" cy="16" r="14" />
  </clipPath>
  <g clip-path="url(#edge)">
    <rect width="32" height="32" fill="#75c2f6" />
    <circle cx="16" cy="15.6" r="7.6" fill="#f4d160" />
    <path d="M0 18Q4 15.2 8 18T16 18T24 18T32 18V32H0Z" fill="#1d5d9b" />
  </g>
  <circle class="rim" cx="16" cy="16" r="14" fill="none" stroke="#002244" stroke-width="3.2" />
</svg>
